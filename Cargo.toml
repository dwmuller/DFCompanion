[package]
name = "dfcompanion"
version = "0.1.0"
edition = "2021"

[dependencies]
askama = "0.16.1"
axum = { version = "0.7", features = ["form"] }
directories = "6"
dfhack-remote = "0.12.0"
genai = "0.7"
keyring = { version = "3", features = ["windows-native"] }
prost = "0.13"
prost-types = "0.13"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync", "net"] }
tonic = { version = "0.12", features = ["transport"] }
url = "2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tower-http = { version = "0.7.1", features = ["trace"] }
pulldown-cmark = "0.13.6"
ammonia = "4.2.4"
futures-util = "0.3.34"

[dev-dependencies]
# Same prost version that dfhack-proto generates its messages with.
prost_014 = { package = "prost", version = "0.14" }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["test-util"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"
