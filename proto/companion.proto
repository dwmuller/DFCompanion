syntax = "proto3";

package dfcompanion.v1;

import "google/protobuf/timestamp.proto";

message SimulationTimestamp {
  int32 year = 1;
  int32 month = 2;
  int32 day = 3;
  int32 tick = 4;
}

message SimulationEvent {
  string category = 1;
  google.protobuf.Timestamp real_world_time_utc = 2;
  SimulationTimestamp game_world_time = 3;
  string description = 4;
}

enum EventSubmissionStatus {
  EVENT_SUBMISSION_STATUS_UNSPECIFIED = 0;
  EVENT_SUBMISSION_STATUS_ACCEPTED = 1;
  EVENT_SUBMISSION_STATUS_PAUSE_REQUESTED_QUEUE_FULL = 2;
}

message EventSubmissionResult {
  EventSubmissionStatus status = 1;
  string message = 2;
}

service Companion {
  rpc SubmitSimulationEvent(SimulationEvent) returns (EventSubmissionResult);
}
