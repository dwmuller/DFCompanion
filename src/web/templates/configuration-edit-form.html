<li id="configuration-{{ values.id }}">
  <form
    data-configuration-form
    hx-put="/fragments/ai-configurations/{{ values.id }}"
    hx-target="#configuration-{{ values.id }}"
    hx-swap="outerHTML"
    hx-disable="find button">

    <b>Editing {{ values.name }}</b>
    <button type="submit">Save changes</button>
    <button
      type="button"
      hx-get="/fragments/ai-configurations/{{ values.id }}/closed"
      hx-target="#configuration-{{ values.id }}"
      hx-swap="outerHTML"
      hx-confirm="Are you sure you want to discard any unsaved edits?">
      Cancel
    </button>
    <button
      type="button"
      hx-delete="/fragments/ai-configurations/{{ values.id }}"
      hx-target="#configuration-{{ values.id }}"
      hx-swap="outerHTML"
      hx-confirm="Are you sure you want to delete this configuration?">
      Delete
    </button>
    <br>
    <br>
    <p id="{{ values.id }}-configuration-form-error" role="alert">{{ error }}</p>
    <br>
    {% include "configuration-form-fields.html" %}

  </form>
</li>
