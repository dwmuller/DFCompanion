<span id="{{ id }}-model-discovery-status">{{ status }}</span>
{% if has_models %}
  <select
    id="{{ id }}-configuration-models"
    data-configuration-models
    hx-swap-oob="innerHTML">
    <option value="">Choose a suggested model</option>
    {% for model in models %}
      <option value="{{ model }}">{{ model }}</option>
    {% endfor %}
  </select>
{% endif %}
