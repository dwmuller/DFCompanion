<div id="notif-{{ id }}" class="notification" data-kind="{{ kind }}">{% if let Some(input_state) = input_state %}<span id="notif-state-{{ id }}" class="input-state" data-input-state="{{ input_state }}"></span>{% endif %}<strong class="notification-header">{{ label }}:</strong><div class="notification-body">{% if markdown %}<div class="markdown-body">{{ body|safe }}</div>{% else %}<div class="plaintext-body">{{ body }}</div>{% endif %}</div></div>
