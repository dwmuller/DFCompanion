<div id="notif-{{ id }}" class="notification" data-kind="{{ kind }}">{% if let Some(input_state) = input_state %}<span id="notif-state-{{ id }}" class="input-state" data-input-state="{{ input_state }}"></span>{% endif %}{% if rollback_eligible %}<form class="rollback-form" data-id="{{ id }}" novalidate hx-post="/rollback/{{ id }}" hx-include="#message" hx-target="#rollback-status" hx-swap="innerHTML" hx-disable="find button" hx-confirm="Roll back to before this message? Every AI reply and game report after it will be lost and cannot be recovered. The game itself is not rolled back."><button type="submit" title="Roll back the AI conversation to just before this message. Replies and reports after it are discarded; the game is not affected.">Rollback</button></form>{% endif %}<strong class="notification-header">{{ label }}:</strong><div class="notification-body">{% if markdown %}<div class="markdown-body">{{ body|safe }}</div>{% else %}<div class="plaintext-body">{{ body }}</div>{% endif %}</div></div>
