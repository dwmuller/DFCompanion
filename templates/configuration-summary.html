<li id="configuration-{{ configuration.id }}">
  <span>
    {{ configuration.name }} —
    {{ configuration.interaction_method }} —
    {{ configuration.model_id }} —
    {% if configuration.api_key_saved %}API key saved{% else %}API key missing{% endif %}
  </span>

  {% if configuration.api_key_saved %}
  <button
    type="button"
    hx-post="/fragments/ai-configurations/{{ configuration.id }}/key"
    hx-target="#configuration-list"
    hx-swap="outerHTML"
    hx-disable="this"
    hx-confirm="Forget the saved API key for {{ configuration.name }}?">
    Forget API key
  </button>
  {% endif %}
</li>
