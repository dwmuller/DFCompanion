<li id="configuration-{{ configuration.id }}">
  <span>
    {{ configuration.name }} —
    {{ configuration.interaction_method }} —
    {{ configuration.model_id }}
  </span>

  {% if configuration.api_key_saved %}
  <button
    type="button"
    hx-delete="/fragments/ai-configurations/{{ configuration.id }}/key"
    hx-target="#configuration-{{ configuration.id }}"
    hx-swap="outerHTML"
    hx-disable="this"
    hx-confirm="Forget the saved API key for {{ configuration.name }}?">
    Forget API key
  </button>
  {% else %}
  <button
    type="button"
    hx-get="/fragments/ai-configurations/{{ configuration.id }}/key"
    hx-target="#configuration-{{ configuration.id }}"
    hx-swap="outerHTML"
    hx-disable="this">
    Add API key
  </button>
  {% endif %}
</li>
